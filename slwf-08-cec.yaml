    id: cec_slot_13
    icon: mdi:hdmi-port
    update_interval: never
  - platform: template
    name: "CEC 14 (Specific use)"
    id: cec_slot_14
    icon: mdi:hdmi-port
    update_interval: never

  - platform: template
    name: "Active source"
    id: active_source            # physical address, for example "1.2.0.0"
    icon: mdi:video-input-hdmi
    update_interval: never

  - platform: template
    name: "Active source device"
    id: active_source_device     # for example "SHIELD (CEC 4)"
    icon: mdi:video-input-hdmi
    update_interval: never

  - platform: template
    name: "Last CEC message"
    id: cec_last_message         # raw frame, for example "4F:82:12:00"
    icon: mdi:message-processing
    update_interval: never
    # Useful for tests. Exclude it from the recorder or disable it after the tests.

  - platform: template
    name: "Bridge physical address"
    id: bridge_phys
    icon: mdi:hdmi-port
    entity_category: diagnostic
    update_interval: never

  - platform: template
    name: "Bridge logical address"
    id: bridge_la
    icon: mdi:hdmi-port
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: template
    name: "TV"
    id: tv_on
    device_class: power

  - platform: template
    name: "Audio system"
    id: audio_on
    device_class: power

# ---------------------------------------------------------------------------
# CEC bus
# ---------------------------------------------------------------------------
hdmi_cec:
  id: cec
  pin: GPIO14
  address: 0x0F                  # unregistered until "allocate_address" selects a free address at boot
  physical_address: ${default_physical_address}   # replaced at boot by the value in flash
  osd_name: "${osd_name}"
  promiscuous_mode: true         # see all messages, not only messages to this bridge
  monitor_mode: false
  on_message:

    # 1. All messages -> replies, HA event, "Last CEC message", passive discovery
    #    (skipped during an OTA upload)
    - then:
        - if:
            condition:
              lambda: "return !id(ota_active);"
            then:
            - lambda: |-
                // Passive discovery: an unknown sender is added and queried.
                // (The bridge also receives its own frames: ignore those.)
                if (source < 15 && source != id(cec).address() && !id(dev_present)[source]) {
                  id(dev_present)[source] = true;
                  id(dev_missed)[source] = 0;
                  id(publish_slot).execute((int) source);
                  id(query_device).execute((int) source);
                }
                // Answer requests addressed to this bridge (required by the CEC standard).
                uint8_t me = id(cec).address();
                if (destination == me && me != 0xF && source != me && !data.empty()) {
                  uint8_t op = data[0];
                  switch (op) {
                    case 0x83: {  // Give Physical Address -> Report Physical Address (broadcast)
                      uint16_t pa = id(own_phys);
                      uint8_t type = (me == 4 || me == 8 || me == 11) ? 4 : (me == 1 || me == 2 || me == 9) ? 1 :
                                     (me == 3 || me == 6 || me == 7 || me == 10) ? 3 : 4;
                      id(cec).send(me, 0xF, {0x84, (uint8_t) (pa >> 8), (uint8_t) (pa & 0xFF), type});
                      break;
                    }
                    case 0x46: {  // Give OSD Name -> Set OSD Name
                      std::vector<uint8_t> r = {0x47};
                      for (char ch : std::string("${osd_name}")) r.push_back((uint8_t) ch);
                      id(cec).send(me, source, r);
                      break;
                    }
                    case 0x8F:    // Give Device Power Status -> On
                      id(cec).send(me, source, {0x90, 0x00});
                      break;
                    case 0x9F:    // Get CEC Version -> 1.4
                      id(cec).send(me, source, {0x9E, 0x05});
                      break;
                    case 0x8C:    // Give Device Vendor ID -> Device Vendor ID (broadcast).
                                  // The LG does not accept Feature Abort here and asks again each 14 s.
                      id(cec).send(me, 0xF, {0x87, 0x00, 0x00, 0x00});
                      break;
                    // Replies and information messages: no answer
                    case 0x00: case 0x36: case 0x47: case 0x72: case 0x7A: case 0x7E: case 0x80:
                    case 0x81: case 0x82: case 0x84: case 0x86: case 0x87: case 0x8E: case 0x90:
                    case 0x9E: case 0xA6:
                      break;
                    default:      // Not supported -> Feature Abort (reason 0 = unrecognized opcode)
                      id(cec).send(me, source, {0x00, op, 0x00});
                      break;
                  }
                }
                // Do not put the power poll replies in the sensor history.
                if (destination == me && !data.empty() && data[0] == 0x90) return;
                std::string hex;
                char b[8];
                snprintf(b, sizeof(b), "%X%X", source & 0x0F, destination & 0x0F);
                hex = b;
                for (auto d : data) { snprintf(b, sizeof(b), ":%02X", d); hex += b; }
                id(cec_last_message).publish_state(hex);
            - homeassistant.event:
                event: esphome.hdmi_cec
                data:
                  source: !lambda "return std::to_string((int) source);"
                  destination: !lambda "return std::to_string((int) destination);"
                  opcode: !lambda "return std::to_string(data.empty() ? -1 : (int) data[0]);"
                  raw: !lambda |-
                    std::string hex;
                    char b[8];
                    snprintf(b, sizeof(b), "%X%X", source & 0x0F, destination & 0x0F);
                    hex = b;
                    for (auto d : data) { snprintf(b, sizeof(b), ":%02X", d); hex += b; }
                    return hex;

    # 2. Report Physical Address (0x84): physical address + device type
    - opcode: 0x84
      then:
        - lambda: |-
            if (data.size() < 3 || source > 14 || source == id(cec).address()) return;
            id(dev_phys)[source] = (data[1] << 8) | data[2];
            // Conflict check: another device reports the physical address of this bridge.
            if (id(dev_phys)[source] == id(own_phys)) {
              ESP_LOGW("cec", "Physical address conflict with CEC %d. Use set_physical_address.", (int) source);
              id(bridge_phys).publish_state("conflict with CEC " + std::to_string((int) source));
            }
            // Many TVs send this when they wake up.
            if (source == 0) id(dev_power)[0] = 0;
            id(publish_slot).execute((int) source);

    # 3. Set OSD Name (0x47): device name, for example "SHIELD"
    - opcode: 0x47
      then:
        - lambda: |-
            if (data.size() < 2 || source > 14 || source == id(cec).address()) return;
            std::string n;
            for (size_t i = 1; i < data.size(); i++) {
              char c = (char) data[i];
              if (c >= 0x20 && c < 0x7F && c != '|') n += c;
            }
            id(dev_name)[source] = n;
            id(publish_slot).execute((int) source);

    # 4. Device Vendor ID (0x87)
    - opcode: 0x87
      then:
        - lambda: |-
            if (data.size() < 4 || source > 14 || source == id(cec).address()) return;
            id(dev_vendor)[source] = ((uint32_t) data[1] << 16) | ((uint32_t) data[2] << 8) | data[3];
            id(publish_slot).execute((int) source);

    # 5. Report Power Status (0x90)
    - opcode: 0x90
      then:
        - lambda: |-
            if (data.size() < 2 || source > 14 || source == id(cec).address()) return;
            id(dev_missed)[source] = 0;
            if (id(dev_power)[source] != data[1]) {
              id(dev_power)[source] = data[1];
              id(publish_slot).execute((int) source);
            }

    # 6. TV sends Standby -> TV goes off
    - source: 0x0
      opcode: 0x36
      then:
        - lambda: |-
            id(dev_power)[0] = 1;
            id(publish_slot).execute(0);

    # 7. Active Source (0x82): a device says "show me". It is on.
    - opcode: 0x82
      then:
        - lambda: |-
            if (data.size() < 3) return;
            int pa = (data[1] << 8) | data[2];
            if (source < 15 && source != id(cec).address()) {
              id(dev_phys)[source] = pa;
              if (id(dev_power)[source] != 0) { id(dev_power)[source] = 0; }
              id(publish_slot).execute((int) source);
            }
            id(publish_active).execute(pa, (int) source);

    # 8. Set Stream Path (0x86): the TV selects an input
    - opcode: 0x86
      then:
        - lambda: |-
            if (data.size() < 3) return;
            id(publish_active).execute((data[1] << 8) | data[2], -1);

    # 9. Routing Change (0x80): a switch (for example the Marantz) changes its input
    - opcode: 0x80
      then:
        - lambda: |-
            if (data.size() < 5) return;
            id(publish_active).execute((data[3] << 8) | data[4], -1);

interval:
  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ota_active);"
              - not:
                  script.is_running: scan_bus
              - not:
                  script.is_running: poll_power
          then:
            - script.execute: poll_power
  - interval: 10min
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ota_active);"
              - not:
                  script.is_running: scan_bus
          then:
            - script.execute: scan_bus

# ---------------------------------------------------------------------------
# Buttons (TV = 0 and audio system = 5 are fixed by the CEC standard)
# Use the "hdmi_cec_send" action for other devices, with the address from the CEC slot sensors.
# ---------------------------------------------------------------------------
button:
  - platform: template
    name: "CEC scan"
    icon: mdi:magnify-scan
    on_press:
      - script.execute: scan_bus

  - platform: template
    name: "TV on"
    icon: mdi:television
    on_press:
      - hdmi_cec.send:
          destination: 0x0
          data: [0x0D]          # Text View On (the LG reacts to this, as the Shield uses it)
      - delay: 300ms
      - hdmi_cec.send:
          destination: 0x0
          data: [0x04]          # Image View On

  - platform: template
    name: "TV standby"
    icon: mdi:television-off
    on_press:
      - hdmi_cec.send:
          destination: 0x0
          data: [0x36]          # Standby

  - platform: template
    name: "All devices standby"
    icon: mdi:power-sleep
    on_press:
      - hdmi_cec.send:
          destination: 0xF
          data: [0x36]

  - platform: template
    name: "Request active source"
    icon: mdi:help-network
    on_press:
      - hdmi_cec.send:
          destination: 0xF
          data: [0x85]

  # Same names as the stock buttons, so the HA entities stay the same.
  - platform: template
    name: "Volume up"
    on_press:
      - hdmi_cec.send:
          destination: 0x5
          data: [0x44, 0x41]    # User Control Pressed: Volume Up
      - delay: 100ms
      - hdmi_cec.send:
          destination: 0x5
          data: [0x45]          # User Control Released

  - platform: template
    name: "Volume Down"
    on_press:
      - hdmi_cec.send:
          destination: 0x5
          data: [0x44, 0x42]
      - delay: 100ms
      - hdmi_cec.send:
          destination: 0x5
          data: [0x45]

  - platform: template
    name: "Mute"
    on_press:
      - hdmi_cec.send:
          destination: 0x5
          data: [0x44, 0x43]
      - delay: 100ms
      - hdmi_cec.send:
          destination: 0x5
          data: [0x45]
